<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .points-badge { background: #ffc107; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 1.2em; }
        .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .nav-card { background: #007BFF; color: white; padding: 20px; text-align: center; border-radius: 8px; text-decoration: none; font-size: 18px; font-weight: bold; }
        .nav-card:hover { background: #0056b3; }
        .logout { color: #dc3545; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Welcome, {{ user.last_name }}!</h1>
        <div class="points-badge">{{ user.points }} Points</div>
    </div>

    <h2>Member Actions</h2>
    <div class="nav-grid">
        <a href="/attendance" class="nav-card">Log Attendance</a>
        <a href="/quiz" class="nav-card">Take Quiz</a>
        <a href="/leaderboard" class="nav-card">View Leaderboard</a>
    </div>

    <br><br>
    <a href="/logout" class="logout">Log Out</a>
</div>

</body>
</html>

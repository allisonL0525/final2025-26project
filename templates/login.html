<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Club Portal - Login</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #C7DFC5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
  
        .login-container { 
            background: white; 
            padding: 40px; 
            border-radius: 12px;
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
            box-sizing: border-box;
        }

        .brand-icon { font-size: 40px; margin-bottom: 10px; }
        h2 { margin-top: 0; color: #223127; font-size: 28px; margin-bottom: 5px; }
        
        input[type="radio"] { display: none; }

        .tabs { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 25px; 
            border-radius: 25px;
            overflow: hidden; 
            background-color: #C7DFC5; 
            border: 2px solid #28A46A; 
        }
        .tabs label { 
            flex: 1; 
            padding: 12px; 
            cursor: pointer; 
            font-size: 16px; 
            color: #28A46A; 
            font-weight: bold; 
            transition: 0.3s; 
        }
        #tab-member:checked ~ .tabs .label-member,
        #tab-exec:checked ~ .tabs .label-exec { 
            background: #28A46A; 
            color: white; 
        }
        
        .form-container { display: none; text-align: left; }
        #tab-member:checked ~ #form-member { display: block; }
        #tab-exec:checked ~ #form-exec { display: block; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #0A122A; font-size: 14px; }
        .form-group input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 15px;
            transition: 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #C7DFC5;
            box-shadow: 0 0 5px #0A122A;
        }
        .submit-link { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            background-color: #28A46A;
            color: white; 
            text-decoration: none; 
            text-align: center; 
            border-radius: 25px;
            font-size: 16px; 
            font-weight: bold; 
            box-sizing: border-box;
            transition: 0.3s; 
            margin-top: 10px;
        }
        .submit-link:hover { background-color: #223127;}
    </style>
</head>
<body>

<div class="login-container">
    <div class="brand-icon">🔬</div>
    <h2>Science Club</h2>
    <p> </p>

    <input type="radio" id="tab-member" name="login-tabs" checked>
    <input type="radio" id="tab-exec" name="login-tabs">

    <div class="tabs">
        <label for="tab-member" class="label-member">Member</label>
        <label for="tab-exec" class="label-exec">Executive</label>
    </div>

    <div id="form-member" class="form-container">
        <div class="form-group">
            <label>Student Number</label>
            <input type="text">
        </div>
        <div class="form-group">
            <label>Last Name</label>
            <input type="text">
        </div>
        <a href="member_dashboard.html" class="submit-link">Login</a>
    </div>

    <div id="form-exec" class="form-container">
        <div class="form-group">
            <label>Username</label>
            <input type="text">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password">
        </div>
        <a href="executive_dashboard.html" class="submit-link">Login</a>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

        .nav-card:hover { background: #495057; border-color: #007BFF; }
        .logout { color: #dc3545; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Executive Control Panel</h1>
        <a href="/logout" class="logout">Log Out</a>
    </div>

    <h2>Management Tools</h2>
    <div class="nav-grid">
        <a href="quiz_creation.html" class="nav-card">Manage Quizzes</a>
        <a href="/modify_data" class="nav-card">Modify Member Points</a>
        <a href="/tracker" class="nav-card"> Master Point Tracker</a>
        <a href="/reports" class="nav-card">Generate Statistics Report</a>
        <a href="/attendance_records" class="nav-card"> Attendance Records</a>
    </div>

</html>
